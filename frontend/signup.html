<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create a shop — warungbersama</title>
  <meta name="theme-color" content="#f5f4ee">
  <link rel="icon" href="static/images/logo/warungbersama-mark.svg" type="image/svg+xml">
  <style>
    :root {
      --page: #f5f4ee;
      --paper: #ffffff;
      --ink: #10292d;
      --muted: #66726f;
      --rule: #e2e0d6;
      --gold: #8c7b33;
      --lilac: #cdc8f6;
      --lilac-ink: #1e1a44;
      --accent: #0f3238;
      --sans: "DM Sans", Inter, ui-sans-serif, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--page);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.5;
    }
    a { color: inherit; }
    .nav {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(720px, calc(100% - 40px));
      margin: 0 auto;
    }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -.03em; text-decoration: none; }
    .card {
      width: min(480px, calc(100% - 40px));
      margin: 24px auto 64px;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 20px;
      padding: 32px 28px 28px;
      box-shadow: 0 30px 60px -40px rgba(16,41,45,.45);
    }
    h1 { margin: 0; font-size: 36px; font-weight: 400; letter-spacing: -.04em; line-height: 1.05; }
    .lede { color: var(--muted); margin: 12px 0 0; }
    label { display: block; margin-top: 18px; font-size: 13px; }
    input {
      width: 100%;
      margin-top: 6px;
      height: 44px;
      border-radius: 10px;
      border: 1px solid var(--rule);
      padding: 0 12px;
      font: inherit;
      color: inherit;
      background: var(--paper);
    }
    input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
    button, .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      padding: 0 22px;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
    }
    button { width: 100%; margin-top: 22px; }
    button:disabled { opacity: .6; cursor: default; }
    .error { color: #8d2f2f; margin-top: 14px; }
    .fine { color: var(--muted); font-size: 13px; margin-top: 16px; text-align: center; }
    .codes { margin: 16px 0 0; padding: 12px 16px; background: var(--page); border-radius: 12px; }
    .codes li { font-variant-numeric: tabular-nums; margin: 4px 0; }
    .gold { color: var(--gold); }
  </style>
</head>
<body>
  <header class="nav">
    <a class="brand" href="index.html">
      <svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true">
        <path fill="#8c7b33" d="M8 28 32 8l24 20z"/>
        <path fill="#0f3238" d="M16 28h6v24h-6zM42 28h6v24h-6zM14 46h36v6H14z"/>
      </svg>
      warungbersama
    </a>
    <a href="login.html">Log in</a>
  </header>
  <main class="card">
    <h1>Open your <span class="gold">own</span> shop.</h1>
    <p class="lede">Each account is a separate till. Another shop on this server cannot see your sales, stock or staff.</p>
    <form id="signup">
      <label>Shop name
        <input name="shopName" required minlength="2" maxlength="60" autocomplete="organization" placeholder="Warung Melati">
      </label>
      <label>Email
        <input name="email" type="email" required maxlength="120" autocomplete="username" placeholder="you@shop.com">
      </label>
      <label>Password
        <input name="password" type="password" required minlength="8" maxlength="72" autocomplete="new-password" placeholder="At least 8 characters">
      </label>
      <label>Confirm password
        <input name="passwordConfirm" type="password" required minlength="8" maxlength="72" autocomplete="new-password">
      </label>
      <p id="error" class="error" hidden></p>
      <button type="submit" id="submit">Create shop</button>
    </form>
    <div id="done" hidden>
      <p>Your shop is ready. Save these recovery codes. They are the way back in if email is unavailable.</p>
      <ul class="codes" id="codes"></ul>
      <a class="btn" href="login.html" style="margin-top:18px">Log in to the till</a>
    </div>
    <p class="fine">Already have a shop? <a href="login.html">Log in</a></p>
  </main>
  <script>
    const form = document.getElementById('signup');
    const error = document.getElementById('error');
    const submit = document.getElementById('submit');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      error.hidden = true;
      const body = Object.fromEntries(new FormData(form));
      if (body.password !== body.passwordConfirm) {
        error.textContent = 'The two passwords do not match.';
        error.hidden = false;
        return;
      }
      submit.disabled = true;
      submit.textContent = 'Opening the shop…';
      try {
        const response = await fetch('/api/saas/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify(body),
        });
        const result = await response.json();
        if (!response.ok || result.type !== 'success') {
          error.textContent = result.message || 'The shop could not be created.';
          error.hidden = false;
          submit.disabled = false;
          submit.textContent = 'Create shop';
          return;
        }
        form.hidden = true;
        const list = document.getElementById('codes');
        const codes = (result.data && result.data.recoveryCodes) || [];
        list.innerHTML = codes.length
          ? codes.map((code) => '<li>' + code + '</li>').join('')
          : '<li>No recovery codes were issued. You can still log in with your email.</li>';
        document.getElementById('done').hidden = false;
      } catch (err) {
        error.textContent = 'The shop could not be created.';
        error.hidden = false;
        submit.disabled = false;
        submit.textContent = 'Create shop';
      }
    });
  </script>
</body>
</html>
